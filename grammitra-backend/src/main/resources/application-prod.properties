# Production runtime defaults. Secrets must be supplied by AWS ECS from
# Secrets Manager or SSM Parameter Store; do not put real values here.

spring.application.name=grammitra-backend

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DB:grammitra}
spring.data.mongodb.auto-index-creation=true
logging.level.org.mongodb.driver=ERROR

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:7200000}

app.cookie.secure=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.otp.store=redis
app.ratelimit.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.repositories.enabled=false

otp.verify.maxAttempts=${OTP_VERIFY_MAX_ATTEMPTS:5}
otp.verify.window=${OTP_VERIFY_WINDOW:PT15M}
otp.send.ip.capacity=${OTP_SEND_IP_CAPACITY:5}
otp.send.ip.window=${OTP_SEND_IP_WINDOW:PT1M}

twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.security.user.name=disabled
spring.security.user.password=disabled
spring.security.user.roles=NONE
